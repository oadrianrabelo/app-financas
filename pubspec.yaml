name: livro_caixa
description: "Finanças da casa, offline."
publish_to: 'none'

# A versão é controlada pelo release-please (não edite na mão).
# O número de build do Android é calculado no CI a partir dela.
version: 0.1.0

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  http: ^1.6.0
  cryptography: ^2.9.0
  package_info_plus: ^10.2.2
  file_picker: ^13.3.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
