# Compila os instaladores e anexa na release indicada.
# Reutilizado pelo Release (versão oficial) e pela Prévia.
name: Build

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-flutter

      - name: Keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 não configurado (veja o README)."; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tostao-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tostao-release.jks" >> "$GITHUB_ENV"

      - name: APK assinado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: tostao
        run: |
          flutter build apk --release --build-name "$VERSION" --build-number "$(scripts/build-number.sh "$VERSION")"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Tostao_${VERSION}_android.apk"
          gh release upload "$TAG" dist/*.apk --clobber

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/setup-flutter

      - run: flutter build windows --release --build-name "$VERSION" --build-number "$(scripts/build-number.sh "$VERSION")"

      # Um Windows limpo pode não ter o Visual C++: as DLLs vão junto com o app.
      - name: DLLs do Visual C++
        run: cp /c/Windows/System32/{msvcp140,vcruntime140,vcruntime140_1}.dll build/windows/x64/runner/Release/

      - name: Instalador (Inno Setup)
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup --no-progress -y
          "$ISCC" "//DAppVersion=$VERSION" packaging/windows/tostao.iss
          gh release upload "$TAG" dist/*.exe --clobber

  linux:
    # 22.04: o AppImage roda em distros com glibc igual ou mais nova.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev
      - uses: ./.github/actions/setup-flutter

      - run: flutter build linux --release --build-name "$VERSION" --build-number "$(scripts/build-number.sh "$VERSION")"

      - name: AppImage e .tar.gz
        run: |
          scripts/build-appimage.sh "$VERSION"
          tar -C build/linux/x64/release/bundle -czf "dist/Tostao_${VERSION}_linux-x86_64.tar.gz" .
          gh release upload "$TAG" dist/*.AppImage dist/*.tar.gz --clobber
